<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & Treasurer — SDA Youth</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">SDA YOUTH ADMIN</div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">🏠 Home</a></li>
                <li><a href="finance.html">💰 Financial Transparency</a></li>
                <li class="active"><a href="admin.html">⚙️ Admin / Treasurer</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Treasurer & Admin Control Panel</h2>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                <div class="card">
                    <h3>Treasurer: Submit Transaction</h3>
                    <form id="createTxnForm" style="margin-top: 15px;">
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="txnDesc" class="form-control" required
                                placeholder="e.g. Snack for Rally">
                        </div>
                        <div class="form-group">
                            <label>Amount (KSh)</label>
                            <input type="number" id="txnAmount" class="form-control" required placeholder="5000">
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="txnType" class="form-control">
                                <option value="expenditure">Expenditure</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" id="txnCat" class="form-control" required
                                placeholder="Transport, Evangelism, etc.">
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="txnDate" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit for Approval</button>
                    </form>
                </div>

                <div class="card">
                    <h3>Administrator: Review Pending</h3>
                    <div id="pendingTxnList" style="margin-top: 15px;"></div>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h3>Financial Audit Log</h3>
                <div id="auditLogContainer" style="margin-top: 10px; font-family: monospace;"></div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
